name: CI - Validação Estática e Integridade

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validacao-estatica:
    name: Validação Estática (HTML / CSS / JS)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar sintaxe JavaScript
        run: |
          node --check script.js
          node --check sw.js
          node --check tests/test_structure.js
          node --check tests/test_responsive.js
          node --check tests/test_planner_comparator.js
          node --check tests/test_pwa.js

      - name: Executar testes automatizados (100% aprovados)
        run: node --test tests/*.js

      - name: Checagem estática de integridade das páginas HTML
        run: |
          node -e "
            const fs = require('fs');
            const paginas = ['index.html', 'js.html'];
            for (const p of paginas) {
              if (!fs.existsSync(p)) {
                console.error('Arquivo ausente: ' + p);
                process.exit(1);
              }
              const conteudo = fs.readFileSync(p, 'utf8');
              if (!conteudo.includes('<!DOCTYPE html>') && !conteudo.includes('<!DOCTYPE HTML>')) {
                console.error(p + ' não possui DOCTYPE HTML5 válido');
                process.exit(1);
              }
            }
            console.log('Páginas HTML validadas com sucesso.');
          "

      - name: Validação estática de CSS
        run: |
          node -e "
            const fs = require('fs');
            const css = fs.readFileSync('style.css', 'utf8');
            const openBraces = (css.match(/{/g) || []).length;
            const closeBraces = (css.match(/}/g) || []).length;
            if (openBraces !== closeBraces) {
              console.error('Erro de chaves desbalanceadas no CSS (' + openBraces + ' != ' + closeBraces + ')');
              process.exit(1);
            }
            console.log('CSS validado estaticamente com sucesso.');
          "

  auditoria-seguranca:
    name: Auditoria DevSecOps & Integridade de Arquivos
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar codificação UTF-8 e integridade
        run: |
          node -e "
            const fs = require('fs');
            const arquivos = ['index.html', 'js.html', 'style.css', 'script.js', 'README.md'];
            let erros = 0;
            for (const f of arquivos) {
              if (!fs.existsSync(f)) continue;
              const buf = fs.readFileSync(f);
              if (buf.length >= 3 && buf[0] === 0xef && buf[1] === 0xbb && buf[2] === 0xbf) {
                console.error(f + ' contém UTF-8 BOM proibido');
                erros++;
              }
              const texto = buf.toString('utf8');
              if (/[\ufffd]/.test(texto)) {
                console.error(f + ' contém caracteres corrompidos (mojibake / 0xFFFD)');
                erros++;
              }
            }
            if (erros > 0) process.exit(1);
            console.log('Codificação UTF-8 confirmada sem problemas.');
          "

      - name: Varredura de credenciais e links inseguros
        run: |
          node -e "
            const fs = require('fs');
            const arquivos = ['index.html', 'js.html', 'style.css', 'script.js'];
            const padraoSegredo = /(api[_-]?key|secret|token|password)\s*[:=]\s*['\"][a-zA-Z0-9_\-]{16,}['\"]/i;
            let falha = false;
            for (const f of arquivos) {
              if (!fs.existsSync(f)) continue;
              const conteudo = fs.readFileSync(f, 'utf8');
              if (padraoSegredo.test(conteudo)) {
                console.error('Possível chave ou segredo exposto em: ' + f);
                falha = true;
              }
            }
            if (falha) process.exit(1);
            console.log('Nenhum segredo ou chave privada exposta.');
          "
